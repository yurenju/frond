<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<!--
  frond's font bindings.

  Two things are pinned here:

  1. Which font a generic family (serif / sans-serif / monospace) resolves to. Books'
     own stylesheets use serif / sans-serif heavily, and if the resolution order floats
     with the base image, the line and page breaks float with it.

  2. How a regional face (TC / SC / JP) is selected. Noto CJK is one family, but because
     of Han unification, shared code points like 骨 and 直 have different glyphs in TC /
     SC / JP, and the OTC actually contains several faces — Noto Serif CJK TC / SC / JP
     and so on. Which one is taken depends on face selection, and face selection is
     usually decided by the document's lang plus fontconfig's language matching — which
     is exactly where the three browsers may each do their own thing. This binds it
     explicitly rather than letting the browser decide.

  ===========================================================================
  Order works on two levels, and the two levels run in different directions. Both were
  verified by measurement; do not change them on intuition.
  ===========================================================================

  The first level is the filename. fontconfig processes /etc/fonts/conf.d/ in filename
  order, and configuration processed later has the chance to override what came earlier.
  Two files in this environment touch the same generic families:

    60-latin.conf           ships with the base image; routes serif to Noto Serif / DejaVu
    70-fonts-noto-cjk.conf  ships with fonts-noto-cjk; does regional binding with weak binding

  This file is numbered 75, after both. 70 is not used because that would leave the
  outcome to be decided by the fifth letter of "fonts" versus "frond" — it would work, but
  nobody could see that it was deliberate.

  The second level is the rule order inside the file, and it runs counter to intuition:

    mode="prepend" does not insert at the front of the family list, it inserts before the
    value the <test> matched. Every rule here matches the same "serif", so a rule applied
    later is inserted closer to "serif", which means further back.

    Conclusion: an earlier-applied rule has higher priority. Language specializations have
    to be written before the general rules.

  Getting it backwards is hard to spot: with the general rule first, serif:lang=ja would
  resolve to the general rule's TC, while serif:lang=zh-tw would still look correct
  because it happens to match the general default — one false green covering one real red.
  The assertions in docker/verify-fonts.sh exist to pin this down.
-->
<fontconfig>

  <!-- ===================================================================
       Japanese
       ===================================================================
       Has to come before the general rules below, or the general rules' TC would beat the
       JP here.
  -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK JP</string>
    </edit>
  </match>

  <!-- ===================================================================
       Simplified Chinese
       ===================================================================
       Both zh-cn and zh-hans have to be listed. Which one a book declares is not ours to
       decide, and listing only one lets the other fall back silently to the general rules
       — which is exactly the hole in "leave it to each browser's own language matching",
       merely moved down a level.
  -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hans</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hans</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <!-- ===================================================================
       Traditional Chinese
       ===================================================================
       The same as the general rules' default, but still listed explicitly: the default is
       there for books that declare no lang, and must not be relied on as the Traditional
       Chinese binding. The day the default changes, this will not break with it.
  -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hant</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hant</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <!-- ===================================================================
       General rules: the default face when there is no lang information
       ===================================================================
       Has to come after every language specialization (see the ordering note in the file
       header).

       A book that declares no lang has to have a definite answer, or it falls back to the
       base image's default resolution order, which is exactly what this is here to block.
       The project is primarily Traditional Chinese, so the default is TC.
  -->
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK TC</string>
    </edit>
  </match>

</fontconfig>

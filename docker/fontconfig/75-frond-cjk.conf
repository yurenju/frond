<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<!--
  frond 的字型綁定。

  兩件事在這裡被釘死：

  1. generic family（serif / sans-serif / monospace）解析到哪個字型。書自己的
     樣式表大量使用 serif / sans-serif，若解析順序隨基底映像浮動，斷行與斷頁
     就跟著浮動。

  2. 區域字面（TC / SC / JP）如何選用。Noto CJK 是一個家族，但因為漢字統一，
     「骨」「直」這類共用碼位在 TC / SC / JP 有不同字形，OTC 內實際裝著
     Noto Serif CJK TC / SC / JP 等多個字面。取到哪一個取決於字面選擇，而字面
     選擇通常由文件的 lang 加上 fontconfig 的語言比對決定——那正是三家瀏覽器
     可能各做各的地方。這裡顯式綁定，不讓瀏覽器自己決定。

  ===========================================================================
  順序有兩層，而且兩層的方向不一樣。兩層都實測驗證過，不要憑直覺改。
  ===========================================================================

  第一層是檔名。fontconfig 依檔名順序處理 /etc/fonts/conf.d/，後處理的設定有
  機會覆蓋先處理的。這個環境裡有兩個檔案會動到同一組 generic family：

    60-latin.conf           基底映像自帶，把 serif 導到 Noto Serif / DejaVu
    70-fonts-noto-cjk.conf  fonts-noto-cjk 套件自帶，做 weak binding 的區域綁定

  本檔編號 75，排在兩者之後。不用 70 是因為那會變成靠 "fonts" 與 "frond" 的
  第五個字母來決定勝負——能動，但沒有人看得出來那是刻意的。

  第二層是檔案內的規則順序，而它與直覺相反：

    mode="prepend" 不是插到 family 清單的最前面，而是插在「被 <test> 命中的
    那個值」前面。這裡每一條規則命中的都是同一個 "serif"，所以後套用的規則
    會插得離 "serif" 更近，也就是排在更後面。

    結論：先套用的規則優先權較高。語言特化必須寫在通則之前。

  寫反了的症狀很難看出來：通則若排在前面，serif:lang=ja 會解析到通則的 TC，
  而 serif:lang=zh-tw 因為跟通則的預設值剛好相同，看起來仍然是對的——一條假綠
  蓋住一條真紅。docker/verify-fonts.sh 的斷言就是為了釘住這件事。
-->
<fontconfig>

  <!-- ===================================================================
       日文
       ===================================================================
       必須排在下面的通則之前，否則通則的 TC 會壓過這裡的 JP。
  -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK JP</string>
    </edit>
  </match>

  <!-- ===================================================================
       簡體中文
       ===================================================================
       zh-cn 與 zh-hans 都要列。書宣告的是哪一種不由我們決定，只列其中一種的
       話另一種會靜默落回通則——那正是「交給各家瀏覽器自己的語言比對」的漏洞，
       只是往下挪了一層。
  -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hans</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hans</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <!-- ===================================================================
       繁體中文
       ===================================================================
       與通則的預設值相同，但仍然要顯式列出：預設值是為「沒宣告 lang 的書」
       準備的，不該被當成繁中的綁定來依賴。哪天預設值改了，這裡不會跟著壞。
  -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hant</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hant</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <!-- ===================================================================
       通則：沒有 lang 資訊時的預設字面
       ===================================================================
       必須排在所有語言特化之後（見檔頭的順序說明）。

       沒宣告 lang 的書必須有一個確定的答案，否則會落回基底映像的預設解析
       順序，那正是要擋掉的東西。專案以繁體中文為主，預設取 TC。
  -->
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK TC</string>
    </edit>
  </match>

</fontconfig>

<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<!--
  frond 的字型綁定。

  兩件事在這裡被釘死：

  1. generic family（serif / sans-serif）解析到哪個字型。書自己的樣式表大量
     使用 serif / sans-serif，若解析順序隨基底映像浮動，斷行與斷頁就跟著浮動。

  2. 區域字面（TC / SC / JP）如何選用。Noto CJK 是一個家族，但因為漢字統一，
     「骨」「直」這類共用碼位在 TC / SC / JP 有不同字形，OTC 內實際裝著
     Noto Serif CJK TC / SC / JP 等多個字面。取到哪一個取決於字面選擇，而字面
     選擇通常由文件的 lang 加上 fontconfig 的語言比對決定——那正是三家瀏覽器
     可能各做各的地方。這裡顯式綁定，不讓瀏覽器自己決定。

  這件事的危險性與 vert / vrt2 同一類：全形漢字多半等寬，選錯區域字面不一定
  會改變斷行，於是幾何不變量可能全數通過而畫面上的字形是錯的。

  處理順序有意義：fontconfig 依文件順序套用 match，mode="prepend" 會把家族
  插到最前面，所以後面的規則會蓋過前面的。通則寫在前，語言特化寫在後。
-->
<fontconfig>

  <!-- ===================================================================
       通則：無 lang 資訊時的預設字面
       ===================================================================
       必須有一個確定的答案，否則「沒宣告 lang 的書」會落回基底映像的預設
       解析順序，那正是要擋掉的東西。專案以繁體中文為主，預設取 TC。
  -->
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <!-- 直排書常見的 monospace 宣告也一併綁定，避免落到無直排字符的等寬字型 -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK TC</string>
    </edit>
  </match>

  <!-- ===================================================================
       日文
       =================================================================== -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <!-- ===================================================================
       繁體中文（zh-TW / zh-Hant）
       =================================================================== -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <!-- ===================================================================
       簡體中文（zh-CN / zh-Hans）
       =================================================================== -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

</fontconfig>

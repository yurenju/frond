name: test

on:
  push:
    branches: [main]
  pull_request:

# Cancel a still-running older run when a PR is pushed to repeatedly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The runner image is named explicitly, not `ubuntu-latest`.
    #
    # `ubuntu-latest` is a movable label in exactly the sense the comment below rejects for
    # actions — it followed 22.04, then 24.04, and it will move again. Everything else this
    # job depends on is pinned (the actions by SHA, the base image by tag, the browsers and
    # the fonts by version), so the runner was the one component free to change underneath a
    # commit that did not.
    #
    # It moved, and it cost three red runs (527ad16, d432f89, 34a281f). The symptom did not
    # look like a runner problem at all:
    #
    #     error running container: from /usr/bin/crun creating container for
    #     [/bin/sh -c apt-get update && apt-get install -y … fonts-noto-cjk …]:
    #     unknown version specified
    #
    # That reads as "installing the fonts failed", and the `RUN` it names never executed.
    # crun is the low-level OCI runtime podman hands off to (`scripts/container.sh` picks
    # podman first, deliberately); `unknown version specified` is crun rejecting the
    # `ociVersion` in the spec podman wrote for it. Two halves of the runner's own container
    # toolchain disagreeing — nothing to do with this repo's code or its Dockerfile. Runs on
    # image 20260720.247.2 were green and 20260726.254.1 red, with the same commit shape.
    #
    # **This narrows the drift, it does not end it.** `ubuntu-24.04` is itself rolling — the
    # two build numbers above are both that label — and GitHub offers no way to pin further.
    # Ending it entirely would take a container job or a self-hosted runner, which is a
    # different order of cost. What this buys is that the next major bump (25.04) arrives as
    # a line in a diff rather than as a Tuesday morning.
    runs-on: ubuntu-24.04
    steps:
      # Actions are always pinned to a commit SHA, never a tag. The reasoning is the same as
      # for pinning the image, the browsers and the fonts (docs/test-environment.md, "why
      # every version is pinned"): a red light where CI moved and the code did not is the
      # hardest to trace. A tag is a movable reference — `v7` drifts with each new release,
      # and even `v7.0.1` can be repointed, so only a SHA is really pinned. The version is
      # written in a comment for people to read.
      #
      # These two actions used to sit at v4, whose declared runtime is the deprecated
      # Node.js 20, and GitHub has already forced execution onto Node 24 (#12). v7 is
      # natively node24.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CI and local machines share one image, and one script. Any step that only takes
      # effect in CI creates a "green locally, red in CI" gap, and a gap at the font layer is
      # extremely hard to trace (ADR-0004).
      - name: Run the test suite in the container
        run: ./scripts/test-in-container.sh

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

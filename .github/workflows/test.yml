name: test

on:
  push:
    branches: [main]
  pull_request:

# 同一個 PR 連續推送時，取消還在跑的舊 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Action 一律釘 commit SHA，不用 tag。理由與映像／瀏覽器／字型釘死同一條
      # （docs/test-environment.md「版本為什麼全部釘死」）：CI 自己動了而程式碼
      # 沒動的紅燈最難查。tag 是可移動的參照——`v7` 會隨新 release 漂移，連
      # `v7.0.1` 都可以被重新指向，所以只有 SHA 是真的釘死。版本寫在註解裡給人看。
      #
      # 這兩個 action 之前停在 v4，宣告的執行環境是已棄用的 Node.js 20，GitHub
      # 已在強制改用 Node 24 執行（#12）。v7 原生就是 node24。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CI 與本機共用同一個映像，也共用同一支腳本。任何只在 CI 生效的步驟都
      # 會製造「本機綠、CI 紅」的落差，而字型層的落差極難查（ADR-0004）。
      - name: Run the test suite in the container
        run: ./scripts/test-in-container.sh

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # TEMPORARY（#12 的驗收證據，合併前移除）：把上傳好的 artifact 原樣抓回來，
  # 印出檔案數、總位元組與目錄結構。看 job 綠燈不能證明 artifact 非空——
  # if-no-files-found: ignore 就是設計成不吵的。
  verify-artifact:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playwright-report
          path: downloaded-report

      - name: Report what actually came back
        run: |
          echo "== 目錄結構 =="
          find downloaded-report -printf '%y %10s %p\n' | sort -k3
          echo "== 檔案數 =="
          find downloaded-report -type f | wc -l
          echo "== 總位元組 =="
          du -sb downloaded-report
          echo "== index.html 大小 =="
          wc -c downloaded-report/index.html
          test -s downloaded-report/index.html

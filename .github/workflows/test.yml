name: test

on:
  push:
    branches: [main]
  pull_request:

# 同一個 PR 連續推送時，取消還在跑的舊 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CI 與本機共用同一個映像，也共用同一支腳本。任何只在 CI 生效的步驟都
      # 會製造「本機綠、CI 紅」的落差，而字型層的落差極難查（ADR-0004）。
      - name: Run the test suite in the container
        run: ./scripts/test-in-container.sh

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

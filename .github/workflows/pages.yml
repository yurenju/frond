name: pages

# The demo page follows main. frond's API is still 0.x (ADR-0008), so the notation the site
# demonstrates and main's source have to be the same thing — pinning to a tag would make
# "I followed the site and it will not compile" possible, and that is the most off-putting
# kind of first impression.
on:
  push:
    branches: [main]
  # When a deploy breaks, it has to be re-runnable without pushing a commit.
  workflow_dispatch:

# A Pages deploy replaces rather than accumulates, and two running at once overwrite each
# other. The one in progress is not cancelled here — an interrupted deploy leaves a partially
# updated site.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are always pinned to a commit SHA, never a tag — the same reasoning as in
      # test.yml: a tag is a movable reference, and only a SHA is really pinned. The version
      # is written in a comment for people to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # `--ignore-scripts` blocks package.json's `prepare`. That script runs `npm run build`,
      # and the `npm run site` below builds frond again — doing it twice does no harm, but
      # blocking it here means that when the site fails to build, what turns red is the
      # `npm run site` step, and the message points precisely.
      - run: npm ci --ignore-scripts

      # It is only worth deploying if the types pass. The example code on the site
      # demonstrates frond's API, and if the API is wrong the site is green while consumers
      # are red.
      - run: npm run typecheck

      # Builds the package and assembles the site. The site is a single cp of `dist/`, with no
      # bundling step — which is what makes the deploy proof that frond's build output is
      # importable directly by a browser. The full reasoning is in `scripts/build-site.sh`'s
      # file header.
      - run: npm run site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

name: release

# Bump the version, tag it, publish to npm. Triggered manually, because "should we cut a
# release" is a decision rather than an event.
#
# ## The last step of this workflow cannot be taken back
#
# This repo publishes one package (ADR-0008; `@yurenju/frond-react` was retired and the repo
# collapsed back to a single package):
#
#     npm install @yurenju/frond
#
# **A version on npm cannot be taken back.** unpublish has only a 72-hour window, and pulling
# a version breaks everyone who already installed it. A mistyped git tag can be deleted and
# redone; a published version cannot — so every verification below is ordered before
# `npm publish`, and `publish` is the workflow's last step.
#
# Those verification steps are not there to prove the code is correct (that is what
# `test.yml` does on every push to main); they are there to prove **the package a consumer
# receives is sound**.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "which component to move"
        type: choice
        required: true
        default: patch
        options:
          # 0.1.0 → 0.1.1. Fixes, documentation, internal refactoring.
          - patch
          # 0.1.0 → 0.2.0. The API changed — during 0.x that is the norm (ADR-0008).
          - minor
          # 0.1.0 → 1.0.0. **This one is more than a number.**
          #
          # In semver, 0.x means "nothing is guaranteed", and 1.0 withdraws that sentence.
          # Before crossing it, go and change ADR-0008 first; do not tag first — a tag can be
          # deleted, a published npm version cannot.
          - major
      dry_run:
        description: "verify only, do not release (no bump, no tag, no publish)"
        type: boolean
        required: false
        default: false

# Two concurrent runs would each compute the same version number, and the second could not
# push (the tag already exists). Queue rather than cancel: a cancelled run may already have
# pushed a commit, tagged, or even published.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # npm's trusted publishing: at publish time this OIDC token proves to the registry "I am
  # this workflow of this repo", so no NPM_TOKEN has to be stored. It is also the source of
  # provenance (package.json's publishConfig.provenance).
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions are always pinned to a commit SHA, never a tag — the same reasoning as in
      # test.yml: a tag is a movable reference, and only a SHA is really pinned. The version
      # is written in a comment for people to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `npm version` has to see the existing tags to avoid colliding.
          fetch-depth: 0

      # Release only from main.
      #
      # `workflow_dispatch`'s dropdown offers every branch, and a tag cut from a feature
      # branch points at a commit that never entered main — that tag then never corresponds to
      # any piece of history, and the way it is usually discovered is a consumer installing
      # code that does not exist on main.
      - name: Confirm we are on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release can only run from main; currently on ${{ github.ref }}"
          exit 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          # This line writes an `.npmrc` and points the registry at npmjs. Trusted publishing
          # needs no NODE_AUTH_TOKEN, but publish still has to know which registry to send to.
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) requires npm >= 11.5.1 and Node >= 22.14.0. The node24
      # pinned above satisfies both, but the built-in npm version drifts with the image — and
      # if that version regresses, the symptom is publish asking for a token that does not
      # exist, with an error message that only says you are not logged in. Install a version
      # explicitly, and print the actual version into the log while we are at it.
      - name: Ensure npm is new enough (trusted publishing needs >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      # `--ignore-scripts` blocks package.json's `prepare`. A build is run explicitly below,
      # and that run's failure message points precisely; mixed into `npm ci`, the red light
      # looks like a dependency that would not install.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      # --- the consumer's route --------------------------------------------
      #
      # Everything up to here verifies the inside of the repo. The two steps below verify
      # **what other people receive**.

      # This step also checks dist/'s two invariants: no .ts specifiers, and no bare specifier
      # beyond what package.json declared as a dependency (for frond: none at all); see
      # scripts/finish-build.ts.
      #
      # `npm pack` below would trigger `prepare` and build anyway, so this line is not what
      # puts `dist/` there. It is here to **fail early and point precisely**: a build error
      # surfacing from inside `npm pack` reads like a packing problem.
      - run: npm run build

      # Pack, install, import.
      #
      # This step catches the class of mistake `npm run build` cannot: a wrong path in
      # `exports`, `files` missing something, a `.d.ts` pointing at a file that does not
      # exist. What they have in common is that **they are green however you run things inside
      # this repo** — because our own code goes through relative paths and never passes through
      # exports.
      - name: Install as a consumer would, and confirm every entry point resolves
        run: |
          set -euo pipefail

          # Packed into a clean directory and picked up with a glob.
          #
          # The filename is deliberately not taken from `npm pack`'s own stdout: any build
          # script's stdout flows into the same pipe, and `--silent` does not stop it. Dropping
          # into an empty directory means the filename's composition never has to be guessed.
          rm -rf /tmp/pack /tmp/consumer
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack > /dev/null
          tarball="$(ls /tmp/pack/*.tgz)"
          echo "packed: $tarball"

          mkdir -p /tmp/consumer
          cd /tmp/consumer
          npm init -y > /dev/null
          npm pkg set type=module
          npm install --ignore-scripts "$tarball"

          cat > check.js <<'JS'
          import { EpubBook } from "@yurenju/frond/epub";
          import { Renderer, MemoryBook } from "@yurenju/frond/renderer";

          for (const [name, value] of Object.entries({ EpubBook, Renderer, MemoryBook })) {
            if (typeof value !== "function") throw new Error(`${name} did not come out of the entry point`);
          }
          console.log("runtime entry points: OK");
          JS
          node check.js

          # The type half has to be verified separately. When a `.d.ts` is broken the import
          # still runs, and every type merely becomes any — which is exactly the hardest kind of
          # breakage to notice (TypeScript 7.0.2's rewriteRelativeImportExtensions does not
          # rewrite .d.ts; see tsconfig.build.json).
          cat > check.ts <<'TS'
          import { EpubBook, type BookMetadata } from "@yurenju/frond/epub";
          import { Renderer, type RenderLocation } from "@yurenju/frond/renderer";

          export async function demo(bytes: ArrayBuffer, host: HTMLElement) {
            const book = await EpubBook.open(bytes);
            const meta: BookMetadata = book.metadata;
            const renderer = await Renderer.attach(book, host, {
              on: { relocate: (at: RenderLocation) => void at.cfi },
            });
            await renderer.next();
            return meta.epubVersion;
          }
          TS

          # skipLibCheck is off: with it on, a shipped .d.ts that fails to resolve would not turn
          # anything red.
          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "module": "nodenext",
              "moduleResolution": "nodenext",
              "target": "ES2022",
              "lib": ["ES2022", "DOM"],
              "strict": true,
              "noEmit": true,
              "skipLibCheck": false
            },
            "files": ["check.ts"]
          }
          JSON
          # The repo's own tsc is invoked directly rather than installing another copy with npx.
          # This is an exception to AGENTS.md's "always go through npm run", and the reason has
          # to be stated: what is being checked is a fake consumer project under /tmp, not this
          # repo, so no npm script should be responsible for it. Using the version the repo pins
          # is what makes the measurement "does the .d.ts a consumer receives resolve on the
          # TypeScript we claim to support".
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" -p tsconfig.json
          echo "type entry points: OK"

          # The sources a map file points at have to actually be in the package.
          #
          # `.d.ts.map` is what makes "jump to definition lands on the source" true
          # (tsconfig.build.json), and it points at `../../src/*.ts` — if `files` did not bring
          # `src/` into the tarball, all those paths are empty. **Nothing turns red for this
          # kind of breakage**: the import runs, the types are right, and only jump-to-definition
          # falls into the void.
          node --input-type=module <<'JS'
          import { readFileSync, existsSync, readdirSync, statSync } from "node:fs";
          import { join, dirname, resolve } from "node:path";

          function mapsUnder(directory) {
            const found = [];
            for (const name of readdirSync(directory)) {
              const path = join(directory, name);
              if (statSync(path).isDirectory()) found.push(...mapsUnder(path));
              else if (name.endsWith(".map")) found.push(path);
            }
            return found;
          }

          const missing = [];

          const maps = mapsUnder(join("node_modules", "@yurenju", "frond", "dist"));
          if (maps.length === 0) throw new Error("no .map at all; the check missed something");

          for (const map of maps) {
            const { sources } = JSON.parse(readFileSync(map, "utf8"));
            for (const source of sources) {
              const path = resolve(dirname(map), source);
              if (!existsSync(path)) missing.push(`${map} → ${source}`);
            }
          }

          if (missing.length > 0) {
            throw new Error(`maps point at sources that do not exist:\n  ${missing.join("\n  ")}`);
          }
          console.log(`map sources: OK (${maps.length} maps)`);
          JS

      # --- cutting the version ----------------------------------------------
      #
      # Not one side effect has happened up to here, so a dry run stops at this point.

      - name: dry run stops here
        if: inputs.dry_run
        run: |
          {
            echo "## dry run: verified, nothing released"
            echo
            echo "Build, entry points (runtime and types) and map sources all passed."
            echo "No version bump, no tag, no publish."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set the commit identity
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ## Why this is not one line of `npm version`
      #
      # `npm version` would bump, commit and tag in one go — but it commits `package.json`
      # alone, leaving `package-lock.json` behind with the old number, and the next `npm ci`
      # then complains that the lock and the manifest disagree. So the bump runs with
      # `--no-git-tag-version` (touching no git), the lockfile is refreshed, and the commit
      # and tag are written out by hand.
      - id: version
        name: Bump the version and tag it
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail

          npm version "${{ inputs.bump }}" --no-git-tag-version > /dev/null

          number="$(npm pkg get version | tr -d '"')"
          tag="v${number}"

          npm install --package-lock-only --ignore-scripts

          git add package.json package-lock.json
          git commit -m "release: ${number}"
          git tag -a "$tag" -m "$tag"

          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "bumped to $tag"

      # `--follow-tags` pushes only annotated tags, which is the one just created. Pushing the
      # commit and the tag together is the point: pushed separately, a failure in between leaves
      # a pushed commit with no tag.
      #
      # Two things relevant to this step that are not in this file:
      #
      #   1. If main has branch protection requiring a PR, this line is rejected. Either give
      #      github-actions[bot] a bypass, or switch to a PR-opening flow.
      #   2. A commit pushed with GITHUB_TOKEN **does not trigger other workflows**, so this push
      #      runs neither test.yml nor a pages redeploy. Neither matters here: the version commit
      #      only touches package.json and package-lock.json, the site's content is unchanged,
      #      and the code itself was verified before the tag was cut.
      - name: Push
        if: ${{ !inputs.dry_run }}
        run: git push --follow-tags origin main

      # --- publishing -------------------------------------------------------

      # publish comes after push, not before.
      #
      # Both can fail, but the costs are asymmetric: pushed without publishing is fixed by
      # re-running `npm publish`; published without pushing leaves a version on npm that
      # corresponds to no commit, and that version cannot be taken back. So the recoverable step
      # goes first.
      #
      # There is no NODE_AUTH_TOKEN: authentication goes through trusted publishing (OIDC),
      # backed by the job's `id-token: write` and the trusted publisher configured on npmjs.
      #
      # ## A package's first version cannot be released by this workflow
      #
      # A trusted publisher's settings page hangs off the package, and npm **does not accept**
      # configuring one in advance for a package that does not yet exist in the registry
      # (npm/cli#8544; PyPI allows it, npm does not). So `@yurenju/frond`'s `0.2.0` was published
      # manually from a local machine to bring the package into existence in the registry, after
      # which a trusted publisher could be configured. Everything from `0.2.1` on goes through
      # this step and needs no token at all. Worth remembering if the package is ever renamed.
      #
      # ## provenance need not be requested explicitly
      #
      # Under trusted publishing npm generates a provenance attestation automatically, with no
      # `--provenance` and no `publishConfig.provenance` required. **And it should not be set**:
      # that manual publish above ran on a local machine with no OIDC available, and explicitly
      # requesting provenance would have made it fail outright. (`0.2.0` therefore has no
      # attestation, while every version released by this step does.)
      #
      # `--access public` is the opposite, and lives in publishConfig: scoped packages default
      # to private, and omitting it makes the registry return an error that looks like a
      # billing-plan problem.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish

      # --- what changed in this version --------------------------------------

      # The release notes are generated by GitHub from "the PRs merged between the previous tag
      # and this one", so this repo maintains no CHANGELOG.
      #
      # That is not just laziness. A hand-written CHANGELOG is a second record that has to stay
      # in sync with the commits, and it rots nastily: a CHANGELOG stuck at some version makes
      # people believe the versions after it had no breaking changes, and that is false.
      # `--generate-notes` reads PR titles — something that gets reviewed anyway, and that nobody
      # "forgets to update".
      #
      # Ordered after publish: release notes are an announcement, and announcing a version that
      # failed to publish is worse than announcing a little late. If this step fails, re-running
      # `gh release create` is enough.
      - name: Generate the release notes
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --verify-tag \
            --generate-notes

      - name: Write the run summary
        if: ${{ !inputs.dry_run }}
        run: |
          {
            echo "## ${{ steps.version.outputs.version }} is out"
            echo
            echo '```bash'
            echo "npm install @yurenju/frond@${{ steps.version.outputs.number }}"
            echo '```'
            echo
            echo "The package consumers receive (build, each entry point's runtime and types,"
            echo "map sources) was verified before publishing."
            echo
            echo "What changed in this version: <${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}>"
          } >> "$GITHUB_STEP_SUMMARY"

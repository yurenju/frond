<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>foliate-js vertical spike</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
      foliate-view { display: block; width: 800px; height: 600px; }
    </style>
  </head>
  <body>
    <script type="module">
      window.__spike = { errors: [] };
      window.addEventListener("error", (e) => window.__spike.errors.push(String(e.message)));
      window.addEventListener("unhandledrejection", (e) => window.__spike.errors.push(String(e.reason)));

      const params = new URLSearchParams(location.search);
      const readerStyles = params.get("styles");
      const bookName = params.get("book") ?? "book.epub";

      try {
        await import("./foliate/view.js");
        const view = document.createElement("foliate-view");
        document.body.append(view);

        const res = await fetch("./" + bookName);
        const file = new File([await res.blob()], bookName);
        await view.open(file);
        if (readerStyles) view.renderer.setStyles(readerStyles);
        await view.init({ showTextStart: true });

        window.__spike.view = view;
        window.__spike.ready = true;
      } catch (e) {
        window.__spike.fatal = String(e && e.stack ? e.stack : e);
        window.__spike.ready = true;
      }
    </script>
  </body>
</html>
